[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studyshop-classroom"
version = "0.1.0"
description = "Учебный проект: тестирование и сборка пакета"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["humanize>=4,<5", "Flask>=3.1,<4", "gunicorn>=23,<26"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "pip-tools>=7,<8"]

[project.scripts]
studyshop = "studyshop.cli:main"

[tool.setuptools.packages.find]
include = ["studyshop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
